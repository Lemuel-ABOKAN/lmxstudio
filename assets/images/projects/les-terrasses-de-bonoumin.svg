<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111112"/>
      <stop offset="0.55" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="light" cx="0.2" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.3" stop-color="#e8e8e8"/>
      <stop offset="0.5" stop-color="#9a9a9a"/>
      <stop offset="0.72" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#6b6b6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c99a4a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e7c281"/>
      <stop offset="1" stop-color="#c99a4a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2000" fill="url(#bg)"/>
  <rect width="1600" height="2000" fill="url(#light)"/>

  <!-- diagonal gold edge (LMX signature) -->
  <rect x="1056" y="-80" width="3" height="2160" fill="url(#gold)" transform="rotate(18 1056 1000)"/>

  <!-- faint grid framing -->
  <rect x="80" y="80" width="1440" height="1840" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- meta -->
  <text x="120" y="180" font-family="'Courier New', monospace" font-size="46" letter-spacing="6" fill="#c99a4a">04</text>
  <text x="1480" y="180" text-anchor="end" font-family="'Courier New', monospace" font-size="40" letter-spacing="4" fill="#d8d8d8" opacity="0.7">2024</text>

  <text x="800" y="898" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="2" fill="url(#metal)" opacity="0.9">LES</text><text x="800" y="1048" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="2" fill="url(#metal)" opacity="0.9">TERRASSES DE</text><text x="800" y="1198" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="2" fill="url(#metal)" opacity="0.9">BONOUMIN</text>

  <text x="800" y="1850" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" letter-spacing="10" fill="#d8d8d8" opacity="0.65">REAL ESTATE · LANDING</text>
